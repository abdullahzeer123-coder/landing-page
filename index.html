<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>القيادة الاستراتيجية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #07182d;
            color: white;
        }

        .page {
            max-width: 900px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        .badge {
            text-align: center;
            color: #f2b84b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            line-height: 1.5;
            margin: 10px 0 20px;
        }

        .subtitle {
            text-align: center;
            color: #d7dce4;
            font-size: 21px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .video-box {
            background: #000;
            border: 2px solid #555;
            border-radius: 14px;
            overflow: hidden;
            margin: 0 auto 35px;
            max-width: 850px;
        }

        video {
            width: 100%;
            display: block;
            background: black;
        }

        .course-title {
            text-align: center;
            color: #f2b84b;
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0 15px;
        }

        .description {
            text-align: center;
            color: #e1e5eb;
            font-size: 18px;
            line-height: 2;
            margin-bottom: 35px;
        }

        .button {
            display: block;
            width: fit-content;
            margin: auto;
            padding: 16px 35px;
            background: #f2b84b;
            color: #07182d;
            text-decoration: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #9da7b5;
            margin-top: 50px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .page {
                padding: 25px 15px 40px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 17px;
            }

            .course-title {
                font-size: 23px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="badge">
            دورة تدريبية
        </div>

        <h1>
            القيادة الاستراتيجية
        </h1>

        <div class="subtitle">
            طوّر مهاراتك في القيادة والتفكير الاستراتيجي
            <br>
            وتعلم كيفية اتخاذ القرارات بفعالية
        </div>

        <div class="video-box">

            <video controls preload="metadata">

                <source src="video.mp4" type="video/mp4">

                المتصفح الخاص بك لا يدعم تشغيل الفيديو.

            </video>

        </div>

        <div class="course-title">
            المحاضرة الأولى
        </div>

        <div class="description">
            شاهد الفيديو التعريفي وابدأ رحلتك في
            <strong>القيادة الاستراتيجية</strong>.
        </div>

        <a href="#video" class="button">
            ابدأ مشاهدة الدورة
        </a>

        <div class="footer">
            © 2026 - القيادة الاستراتيجية
        </div>

    </div>

</body>

</html>
